# Render Blueprint: the Remedy web service and its Postgres database.
# In the Render Dashboard choose New > Blueprint, pick this repository, and fill in the values marked sync: false.
#
#   remedy                 the web app (Next.js), its API and MCP server
#   remedy-worker          the job worker: photo checks and payouts run here, off the request path (scripts/worker.ts)
#   remedy-recall-ingest   a daily cron job that asks the web app to pull the day's new recalls
#   remedy-db              Postgres 17; tables come from the reviewed SQL in db/schema.sql
services:
  - type: web
    name: remedy
    runtime: node
    plan: starter # 0.5 CPU, 512 MB, always on
    region: oregon
    buildCommand: npm ci && npm run build
    # Apply the reviewed schema (idempotent), load the recall data, and seed the sample firm and its sample claim history.
    preDeployCommand: node scripts/migrate.mjs && npx tsx scripts/load-recalls.ts && npx tsx scripts/seed.ts && npx tsx scripts/seed-firm.ts
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: DATABASE_URL
        fromDatabase:
          name: remedy-db
          property: connectionString
      - key: AUDIT_SALT
        generateValue: true
      - key: DATA_KEY # encrypts contact details at rest (src/lib/secure.ts)
        generateValue: true
      - key: CHECKS_SECRET
        generateValue: true
      - key: REMEDY_SECRET_KEY # encrypts where each payout goes, inside its payment plan (src/lib/payments/seal.ts)
        generateValue: true
      - key: AI_DAILY_USD # daily cap on Claude spend; past it, photos go to a person at the firm
        value: "2"
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: NEXT_PUBLIC_PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_WEBHOOK_ID # from a sandbox webhook pointed at https://<service>/api/webhooks/paypal
        sync: false
      - key: PAYPAL_VENDOR_EMAIL # the sandbox business account that stands in for the retailer of a safe replacement
        sync: false
      - key: NEXT_PUBLIC_AG_STUDIO_LICENSE_KEY
        sync: false
      # Optional: each has a working fallback until it is set.
      - key: ELASTIC_URL
        sync: false
      - key: ELASTIC_API_KEY
        sync: false
      - key: CHANNEL3_API_KEY
        sync: false
      - key: KERNEL_API_KEY
        sync: false
      - key: ZAPIER_MCP_URL
        sync: false
      - key: ASTROPODS_AGENT_URL
        sync: false
      - key: ASTROPODS_API_KEY
        sync: false
      - key: RENDER_API_KEY
        sync: false
      - key: SENTRY_DSN # error tracking; unset, errors stay in the structured log only
        sync: false

  # The job worker: takes verify_claim and pay_claim jobs off the job table (src/lib/jobs). Same code and env as the
  # web service; its heartbeat shows on /status and /ops. Without it, each route runs its job inline after 2 s.
  - type: worker
    name: remedy-worker
    runtime: node
    plan: starter
    region: oregon
    buildCommand: npm ci
    startCommand: npx tsx scripts/worker.ts
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: DATABASE_URL
        fromDatabase:
          name: remedy-db
          property: connectionString
      - key: AUDIT_SALT
        fromService:
          type: web
          name: remedy
          envVarKey: AUDIT_SALT
      - key: DATA_KEY
        fromService:
          type: web
          name: remedy
          envVarKey: DATA_KEY
      - key: CHECKS_SECRET
        fromService:
          type: web
          name: remedy
          envVarKey: CHECKS_SECRET
      - key: REMEDY_SECRET_KEY
        fromService:
          type: web
          name: remedy
          envVarKey: REMEDY_SECRET_KEY
      - key: AI_DAILY_USD
        value: "2"
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: PAYPAL_VENDOR_EMAIL
        sync: false
      - key: ELASTIC_URL
        sync: false
      - key: ELASTIC_API_KEY
        sync: false
      - key: CHANNEL3_API_KEY
        sync: false
      - key: SENTRY_DSN
        sync: false

  # Once a day: pull every new CPSC recall, read its proof rule, hash its images, and refresh search (scripts/recalls/daily.ts).
  - type: cron
    name: remedy-recall-ingest
    runtime: node
    plan: starter
    region: oregon
    schedule: "20 14 * * *" # 14:20 UTC, after the CPSC's morning announcements
    buildCommand: "true"
    startCommand: curl -fsS --max-time 290 -X POST -H "Authorization: Bearer $CHECKS_SECRET" "$REMEDY_URL/api/ops/recalls/daily"
    envVars:
      - key: CHECKS_SECRET # the same secret the web service holds
        fromService:
          type: web
          name: remedy
          envVarKey: CHECKS_SECRET
      - key: REMEDY_URL # the web service's public address, with no trailing slash
        value: https://remedy-y0ym.onrender.com

databases:
  - name: remedy-db
    plan: basic-256mb # 0.1 CPU, 256 MB
    databaseName: remedy
    user: remedy
    postgresMajorVersion: "17"
    diskSizeGB: 1
    region: oregon
    ipAllowList: [] # reachable only from services in this Render workspace
