services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: remedy
      POSTGRES_PASSWORD: remedy
      POSTGRES_DB: remedy
    ports:
      - "5432:5432"
    volumes:
      - remedy-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U remedy"]
      interval: 5s
      retries: 10
volumes:
  remedy-pg:
