<svg xmlns="http://www.w3.org/2000/svg" width="960" height="276" viewBox="0 0 960 276" role="img" aria-labelledby="flow-title flow-desc">
  <title id="flow-title">From one photo to a PayPal refund</title>
  <desc id="flow-desc">One photo of the product made safe goes through six checks in code, with two reviewers when a check is unsure; the router picks a refund to the original PayPal capture inside 180 days, or else a payout; PayPal pays, once per attempt.</desc>
  <style>
    .bg { fill: #f4f5f0; }
    .panel { fill: #ffffff; }
    .paid { fill: #d4ff24; }
    .ink { fill: #030407; }
    .muted { fill: #5b606b; }
    .paid-text { fill: #030407; }
    .arrow { stroke: #7c8176; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    text { font-family: "IBM Plex Sans", -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .lead { font-size: 18px; font-weight: 600; }
    .title { font-size: 19px; font-weight: 600; }
    .body { font-size: 14.5px; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #030407; }
      .panel { fill: #161922; }
      .ink { fill: #f3f4f0; }
      .muted { fill: #9ea3ae; }
      .arrow { stroke: #9ea3ae; }
    }
  </style>
  <rect class="bg" width="960" height="276" rx="16" />
  <text class="ink lead" x="28" y="42">From one photo to a PayPal refund, every decision made in code</text>

  <rect class="panel" x="24" y="64" width="204" height="184" rx="12" />
  <text class="ink title" x="44" y="100">One photo</text>
  <text class="muted body" x="44" y="128">The product made safe</text>
  <text class="muted body" x="44" y="149">the way the recall asks:</text>
  <text class="muted body" x="44" y="170">cord cut, cut in half,</text>
  <text class="muted body" x="44" y="191">or marked RECALLED.</text>

  <path class="arrow" d="M236 156h22m-7 -7 7 7 -7 7" />

  <rect class="panel" x="266" y="64" width="204" height="184" rx="12" />
  <text class="ink title" x="286" y="100">Six checks</text>
  <text class="muted body" x="286" y="128">Right product, made safe,</text>
  <text class="muted body" x="286" y="149">own photo, within the</text>
  <text class="muted body" x="286" y="170">recall, claim limits, not</text>
  <text class="muted body" x="286" y="191">refunded before. Two</text>
  <text class="muted body" x="286" y="212">reviewers when unsure.</text>

  <path class="arrow" d="M478 156h22m-7 -7 7 7 -7 7" />

  <rect class="panel" x="508" y="64" width="204" height="184" rx="12" />
  <text class="ink title" x="528" y="100">The router</text>
  <text class="muted body" x="528" y="128">Inside PayPal&#8217;s 180 days:</text>
  <text class="muted body" x="528" y="149">a refund to the original</text>
  <text class="muted body" x="528" y="170">capture. After them: a</text>
  <text class="muted body" x="528" y="191">payout to an email or</text>
  <text class="muted body" x="528" y="212">phone. Plain code.</text>

  <path class="arrow" d="M720 156h22m-7 -7 7 7 -7 7" />

  <rect class="paid" x="750" y="64" width="186" height="184" rx="12" />
  <text class="paid-text title" x="770" y="100">PayPal pays</text>
  <text class="paid-text body" x="770" y="128">Refunds or Payouts,</text>
  <text class="paid-text body" x="770" y="149">one PayPal-Request-Id</text>
  <text class="paid-text body" x="770" y="170">per attempt, so a retry</text>
  <text class="paid-text body" x="770" y="191">never pays twice.</text>
  <text class="paid-text body" x="770" y="212">Sandbox.</text>
</svg>
